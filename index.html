<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaEPG | Buscador de Canales e IDs</title>
    <link rel="canonical" href="https://novaplaytv.github.io/novaepg/" />
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b91c1c;
            --bg: #080a10;
            --card-bg: #11151f;
            --input-bg: #1a1f2e;
            --text: #ffffff;
            --text-muted: #9aa3b2;
            --border: rgba(255,255,255,0.05);
            --nav-height: 70px;
        }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
        html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; min-height: 100%; }

        /* Navegación Premium Unificada */
        .nova-nav { position: fixed; top: 0; width: 100%; z-index: 10000; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-inner { max-width: 1400px; margin: auto; height: var(--nav-height); padding: 0 30px; display: flex; align-items: center; justify-content: space-between; }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 900; font-size: 18px; letter-spacing: -0.5px; }
        .nav-brand img { width: 36px; height: 32px; border-radius: 8px; flex-shrink: 0; }

        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.2s; padding: 10px 15px; border-radius: 10px; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 10px; flex-direction: column; gap: 5px; z-index: 10001; }
        .nav-toggle span { display: block; width: 25px; height: 3px; background: #fff; transition: 0.3s; border-radius: 2px; }

        .admin-menu { position: relative; display: flex; align-items: center; height: var(--nav-height); padding: 0 10px; }
        .btn-admin { background: #fff; color: #000; font-weight: 900; border: none; cursor: pointer; padding: 10px 20px; border-radius: 12px; font-size: 12px; display: flex; align-items: center; gap: 10px; transition: 0.2s; position: relative; z-index: 10002; }
        .btn-admin:hover { background: var(--primary); color: #fff; box-shadow: 0 0 20px rgba(229,9,20,0.4); }
        .dropdown-content { position: absolute; top: 100%; right: 0; background: var(--card-bg); min-width: 260px; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; display: none; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 10001; margin-top: 5px; }
        .dropdown-content::before { content: ""; position: absolute; top: -30px; left: 0; right: 0; height: 40px; background: transparent; }
        .admin-menu:hover .dropdown-content { display: flex; }
        .dropdown-content a { padding: 15px 20px; color: #fff !important; text-decoration: none !important; font-size: 13px !important; font-weight: 700 !important; border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.2s; display: flex; align-items: center; gap: 12px; }
        .dropdown-content a i { width: 20px; color: var(--primary); text-align: center; }
        .dropdown-content a:hover { background: rgba(255,255,255,0.05); padding-left: 25px; }

        /* Search Container */
        .search-container { max-width: 1000px; margin: 120px auto 40px; padding: 0 20px; }
        .search-header { text-align: center; margin-bottom: 50px; }
        .search-header h1 { font-size: 54px; font-weight: 900; letter-spacing: -2px; }
        .search-header p { color: var(--text-muted); font-size: 18px; margin-top: 10px; }

        .search-bar { max-width: 600px; margin: 30px auto; position: relative; }
        .search-bar input { width: 100%; padding: 18px 25px 18px 60px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 20px; color: #fff; font-size: 16px; transition: 0.3s; }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.2); }
        .search-bar i { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 20px; }

        .quick-filters { display: flex; gap: 10px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
        .quick-filters button { background: var(--input-bg); color: #fff; border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 800; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .quick-filters button:hover { border-color: var(--primary); background: rgba(255,255,255,0.05); }

        .channel-result { background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 30px; margin-bottom: 20px; display: grid; grid-template-columns: 100px 1fr 320px; gap: 30px; align-items: center; transition: 0.3s; }
        .channel-result:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 15px 40px rgba(0,0,0,0.4); }

        .ch-logo { width: 100px; height: 100px; border-radius: 16px; background: #000; object-fit: contain; border: 1px solid var(--border); }
        .ch-info h3 { font-size: 24px; margin-bottom: 10px; font-weight: 900; }
        .ch-country { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; font-weight: 800; }

        .id-badge { display: inline-flex; align-items: center; gap: 10px; background: rgba(229, 9, 20, 0.1); color: var(--primary); padding: 8px 16px; border-radius: 10px; font-family: monospace; font-weight: 800; font-size: 14px; cursor: pointer; border: 1px solid rgba(229, 9, 20, 0.2); transition: 0.2s; }
        .id-badge:hover { background: var(--primary); color: #fff; }

        .prog-mini-list { list-style: none; border-left: 1px solid var(--border); padding-left: 25px; }
        .prog-mini-item { margin-bottom: 10px; font-size: 14px; }
        .prog-time { font-weight: 800; color: var(--primary); margin-right: 10px; }
        .prog-title { color: #fff; font-weight: 600; }

        .btn-full-guide { margin-top: 20px; display: inline-flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 12px; font-weight: 800; text-transform: uppercase; transition: 0.2s; }
        .btn-full-guide:hover { color: var(--primary); }

        @media (max-width: 900px) {
            .nav-toggle { display: flex; }
            .nav-links { position: fixed; top: 0; right: -100%; width: 100%; height: 100vh; background: rgba(8, 10, 16, 0.98); backdrop-filter: blur(20px); flex-direction: column; justify-content: center; align-items: center; transition: 0.4s; gap: 20px; padding: 40px; z-index: 9999; }
            .nav-links.active { right: 0; }
            .channel-result { grid-template-columns: 80px 1fr; }
            .prog-mini-list { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--border); padding: 20px 0 0; }
            .ch-logo { width: 80px; height: 80px; }
            .search-header h1 { font-size: 38px; }
        }
    </style>
</head>
<body>

<nav class="nova-nav">
    <div class="nav-inner">
        <a class="nav-brand" href="https://novaplaytv.github.io/Dashboard/">
            <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp" alt="Logo">
            <div style="display: flex; flex-direction: column; line-height: 1;">
                NOVAPLAY | BUSCADOR EPG
                <span id="statusBadge" style="font-size: 8px; font-weight: 800; margin-top: 4px; letter-spacing: 0; opacity: 0.8; color: #4caf50;">🟢 OPERATIVO</span>
            </div>
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="https://novaplaytv.github.io/" style="color: var(--primary); font-weight: 800;">INICIO</a>
            <div class="admin-menu" id="adminMenu">
                <button class="btn-admin"><i class="fas fa-user-shield"></i> PANEL</button>
                <div class="dropdown-content">
                    <a href="https://novaplaytv.github.io/Dashboard/"><i class="fas fa-chart-line"></i> Dashboard Central</a>
                    <a href="https://novaplaytv.github.io/panel-canales/"><i class="fas fa-tv"></i> Admin. Canales</a>
                    <a href="https://novaplaytv.github.io/NovaSecurity/"><i class="fas fa-shield-alt"></i> NovaSecurity</a>
                    <a href="https://novaplaytv.github.io/SignalVerificador/"><i class="fas fa-broadcast-tower"></i> Verificador de Señal</a>
                    <a href="https://novaplaytv.github.io/novaimg/actualizar-icono/"><i class="fas fa-icons"></i> Gestión de Iconos</a>
                    <a href="https://novaplaytv.github.io/novaimg/generador/"><i class="fas fa-magic"></i> Icon Studio</a>
                    <a href="https://novaplaytv.github.io/novaepg/"><i class="fas fa-calendar-alt"></i> Buscador EPG ID</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="search-container">
    <div class="search-header">
        <h1>Busca tu Canal</h1>
        <p>Encuentra el EPG ID y consulta la programación al instante.</p>
    </div>

    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="mainSearch" placeholder="Escribe nombre del canal o ID..." oninput="search()">
    </div>

    <div class="quick-filters">
        <button onclick="applyFilter('')"><i class="fa-solid fa-globe"></i> TODOS</button>
        <button onclick="applyFilter('Pluto TV')" style="color: #0073ff; border-color: #0073ff;"><i class="fa-solid fa-play"></i> PLUTO TV</button>
        <button onclick="applyFilter('TVMAX')" style="color: var(--primary); border-color: var(--primary);"><i class="fa-solid fa-star"></i> TVMAX</button>
        <button onclick="applyFilter('NovaSports')" style="color: #10b981; border-color: #10b981;"><i class="fa-solid fa-trophy"></i> NOVASPORTS</button>
    </div>

    <div id="resultsArea">
        <div style="text-align: center; padding: 50px; color: var(--text-muted);">
            <i class="fa-solid fa-tv fa-3x" style="margin-bottom: 20px; opacity: 0.2;"></i>
            <p>Escribe algo para empezar a buscar...</p>
        </div>
    </div>
</div>

<script>
    let searchData = [];
    const clock = () => new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 14);

    async function init() {
        try {
            const res = await fetch('data/search_db.json?t=' + Date.now());
            searchData = await res.json();
        } catch (e) {
            console.error("Error cargando DB:", e);
            document.getElementById('resultsArea').innerHTML = '<p style="text-align:center;">Error al cargar la base de datos de canales.</p>';
        }
    }

    function parseEpgDate(s) {
        return new Date(Date.UTC(
            s.substring(0, 4),
            parseInt(s.substring(4, 6)) - 1,
            s.substring(6, 8),
            s.substring(8, 10),
            s.substring(10, 12),
            s.substring(12, 14)
        ));
    }

    function formatTime(s) {
        const d = parseEpgDate(s);
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    function search() {
        const val = document.getElementById('mainSearch').value.toLowerCase();
        const area = document.getElementById('resultsArea');
        if (val.length < 2) {
            area.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-muted);"><i class="fa-solid fa-tv fa-3x" style="margin-bottom: 20px; opacity: 0.2;"></i><p>Escribe al menos 2 letras...</p></div>';
            return;
        }
        const filtered = searchData.filter(c => c.n.toLowerCase().includes(val) || c.id.toLowerCase().includes(val) || c.c.toLowerCase().includes(val)).slice(0, 40);
        if (filtered.length === 0) {
            area.innerHTML = '<p style="text-align:center; padding: 50px;">No se encontraron canales.</p>';
            return;
        }
        area.innerHTML = filtered.map(c => {
            const programs = c.p.map(p => `<div class="prog-mini-item"><span class="prog-time">${formatTime(p.s)}</span><span class="prog-title">${p.t}</span></div>`).join('');
            return `
                <div class="channel-result" style="${c.c === 'Pluto TV' ? 'border-left: 5px solid #0073ff;' : ''}">
                    <img src="${c.l || 'https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp'}" class="ch-logo" onerror="this.src='https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp'">
                    <div class="ch-info">
                        <div class="ch-country" style="${c.c === 'Pluto TV' ? 'color: #0073ff;' : ''}">${c.c === 'Pluto TV' ? '<i class="fa-solid fa-circle-play"></i> PLUTO TV' : c.c}</div>
                        <h3>${c.n}</h3>
                        <div class="id-badge" onclick="copyId('${c.id}')"><i class="fa-regular fa-copy"></i> ${c.id}</div>
                        <br><a href="epg.html?file=${encodeURIComponent(c.f)}&n=${encodeURIComponent(c.c)}" class="btn-full-guide"><i class="fa-solid fa-calendar-days"></i> Ver guía completa</a>
                    </div>
                    <div class="prog-mini-list">
                        <div style="font-weight: 800; font-size: 11px; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase;">Próximos Programas</div>
                        ${programs || '<p style="font-size:12px; color:var(--text-muted);">Sin programación disponible.</p>'}
                    </div>
                </div>`;
        }).join('');
    }

    function copyId(id) {
        navigator.clipboard.writeText(id).then(() => {
            event.currentTarget.innerHTML = '<i class="fa-solid fa-check"></i> COPIADO';
            alert('Copiado: ' + id);
        });
    }

    function applyFilter(text) {
        document.getElementById('mainSearch').value = text;
        search();
    }

    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    if (navToggle) { navToggle.addEventListener('click', () => { navToggle.classList.toggle('active'); navLinks.classList.toggle('active'); }); }

    init();
</script>
</body>
</html>
