<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaEPG | Buscador de Canales e IDs</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .search-container { max-width: 900px; margin: 100px auto 40px; padding: 0 20px; }
        .search-header { text-align: center; margin-bottom: 50px; }
        .search-header h1 { font-size: 54px; font-weight: 900; letter-spacing: -2px; }
        .search-header p { color: var(--text-muted); font-size: 18px; margin-top: 10px; }

        .id-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(229, 9, 20, 0.1);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid rgba(229, 9, 20, 0.2);
            transition: 0.2s;
        }
        .id-badge:hover { background: var(--primary); color: #fff; }

        .channel-result {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 80px 1fr 300px;
            gap: 25px;
            align-items: center;
            transition: 0.3s;
        }
        .channel-result:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        .ch-logo { width: 80px; height: 80px; border-radius: 12px; background: #000; object-fit: contain; }

        .ch-info h3 { font-size: 22px; margin-bottom: 8px; font-weight: 800; }
        .ch-country { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

        .prog-mini-list { list-style: none; border-left: 1px solid var(--border); padding-left: 20px; }
        .prog-mini-item { margin-bottom: 8px; font-size: 13px; }
        .prog-time { font-weight: 700; color: var(--primary); margin-right: 8px; }
        .prog-title { color: #fff; font-weight: 500; }

        .btn-full-guide {
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-full-guide:hover { color: var(--primary); }

        @media (max-width: 800px) {
            .channel-result { grid-template-columns: 60px 1fr; }
            .prog-mini-list { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--border); padding: 15px 0 0; }
            .ch-logo { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">NOVA<span>EPG</span></a>
    </nav>

    <div class="search-container">
        <div class="search-header">
            <h1>Busca tu Canal</h1>
            <p>Encuentra el EPG ID y consulta la programación al instante.</p>
        </div>

        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="mainSearch" placeholder="Escribe nombre del canal o ID..." oninput="search()">
        </div>

        <!-- Botones de Filtro (Obligatorios) -->
        <div class="quick-filters" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap;">
            <button onclick="applyFilter('')" style="background: var(--input-bg); color: #fff; border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 800; transition: 0.3s;">
                <i class="fa-solid fa-globe"></i> TODOS
            </button>
            <button onclick="applyFilter('Pluto TV')" style="background: rgba(0, 115, 255, 0.1); color: #0073ff; border: 1px solid #0073ff; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 800; transition: 0.3s;">
                <i class="fa-solid fa-play"></i> PLUTO TV
            </button>
            <button onclick="applyFilter('TVMAX')" style="background: rgba(229, 9, 20, 0.1); color: var(--primary); border: 1px solid var(--primary); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 800; transition: 0.3s;">
                <i class="fa-solid fa-star"></i> TVMAX
            </button>
            <button onclick="applyFilter('NovaSports')" style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 800; transition: 0.3s;">
                <i class="fa-solid fa-trophy"></i> NOVASPORTS
            </button>
        </div>

        <div id="resultsArea">
            <!-- Cargado dinámicamente -->
            <div style="text-align: center; padding: 50px; color: var(--text-muted);">
                <i class="fa-solid fa-tv fa-3x" style="margin-bottom: 20px; opacity: 0.2;"></i>
                <p>Escribe algo para empezar a buscar...</p>
            </div>
        </div>
    </div>

    <script>
        let searchData = [];
        const clock = () => new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 14);

        async function init() {
            try {
                const res = await fetch('data/search_db.json?t=' + Date.now());
                searchData = await res.json();
                console.log("Datos cargados:", searchData.length);
            } catch (e) {
                console.error("Error cargando DB:", e);
                document.getElementById('resultsArea').innerHTML = '<p style="text-align:center;">Error al cargar la base de datos de canales.</p>';
            }
        }

        function parseEpgDate(s) {
            return new Date(Date.UTC(
                s.substring(0, 4),
                parseInt(s.substring(4, 6)) - 1,
                s.substring(6, 8),
                s.substring(8, 10),
                s.substring(10, 12),
                s.substring(12, 14)
            ));
        }

        function formatTime(s) {
            const d = parseEpgDate(s);
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        function search() {
            const val = document.getElementById('mainSearch').value.toLowerCase();
            const area = document.getElementById('resultsArea');

            if (val.length < 2) {
                area.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-muted);"><i class="fa-solid fa-tv fa-3x" style="margin-bottom: 20px; opacity: 0.2;"></i><p>Escribe al menos 2 letras...</p></div>';
                return;
            }

            const filtered = searchData.filter(c =>
                c.n.toLowerCase().includes(val) ||
                c.id.toLowerCase().includes(val) ||
                c.c.toLowerCase().includes(val)
            ).slice(0, 40);

            if (filtered.length === 0) {
                area.innerHTML = '<p style="text-align:center; padding: 50px;">No se encontraron canales.</p>';
                return;
            }

            const now = clock();

            area.innerHTML = filtered.map(c => {
                const programs = c.p.map(p => `
                    <div class="prog-mini-item">
                        <span class="prog-time">${formatTime(p.s)}</span>
                        <span class="prog-title">${p.t}</span>
                    </div>
                `).join('');

                return `
                    <div class="channel-result" style="${c.c === 'Pluto TV' ? 'border-left: 5px solid #0073ff;' : ''}">
                        <img src="${c.l || 'https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp'}" class="ch-logo" onerror="this.src='https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp'">

                        <div class="ch-info">
                            <div class="ch-country" style="${c.c === 'Pluto TV' ? 'color: #0073ff; font-weight: 900;' : ''}">
                                ${c.c === 'Pluto TV' ? '<i class="fa-solid fa-circle-play"></i> PLUTO TV' : c.c}
                            </div>
                            <h3>${c.n}</h3>
                            <div class="id-badge" onclick="copyId('${c.id}')">
                                <i class="fa-regular fa-copy"></i> ${c.id}
                            </div>
                            <br>
                            <a href="epg.html?file=${encodeURIComponent(c.f)}&n=${encodeURIComponent(c.c)}" class="btn-full-guide">
                                <i class="fa-solid fa-calendar-days"></i> Ver guía completa
                            </a>
                        </div>

                        <div class="prog-mini-list">
                            <div style="font-weight: 800; font-size: 11px; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase;">Próximos Programas</div>
                            ${programs || '<p style="font-size:12px; color:var(--text-muted);">Sin programación disponible.</p>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function copyId(id) {
            navigator.clipboard.writeText(id).then(() => {
                const originalText = event.currentTarget.innerHTML;
                event.currentTarget.innerHTML = '<i class="fa-solid fa-check"></i> COPIADO';
                setTimeout(() => {
                    const badge = document.querySelector(`.id-badge`); // This is slightly buggy if multiple results, but user just clicked it.
                    // Better approach:
                }, 1000);
                alert('Copiado: ' + id);
            });
        }

        function applyFilter(text) {
            document.getElementById('mainSearch').value = text;
            search();
        }

        init();
    </script>
</body>
</html>
